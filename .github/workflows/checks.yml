name: Labs checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: pip install -r companion/requirements.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python -m unittest discover -s companion -p 'test_*.py'
      - run: npm run build
